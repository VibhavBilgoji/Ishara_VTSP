name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Lint checks
        run: bun run lint

      - name: Security and sanity checks
        run: node scripts/check-security.mjs

      - name: Typegen and TypeScript checks
        run: bunx --bun tsc --noEmit || true

      - name: Build Next.js application
        run: bun run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://demo-supabase-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
          NEXT_PUBLIC_LIVEKIT_URL: wss://demo.livekit.cloud
